[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-factory-core"
version = "0.2.0"
description = "Local-first orchestration core for AI Factory"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
